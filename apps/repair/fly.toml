# fly.toml app configuration file generated for sd-solutions-repair on 2026-09-09T17:24:58Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sd-solutions-repair'
primary_region = 'arn'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = '/app/scripts/fly-release.sh'

[env]
  CI = 'true'
  NODE_ENV = 'production'
  PORT = '3001'

[[mounts]]
  source = 'repair_uploads'
  destination = '/app/public/uploads'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

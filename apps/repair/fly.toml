  release_command = "/app/scripts/fly-release.sh"

[env]
  PORT = "3001"
  NODE_ENV = "production"
  CI = "true"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "repair_uploads"
  destination = "/app/public/uploads"

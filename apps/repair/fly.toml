# fly.toml app configuration file generated for SD Solutions Repair Ops
# See https://fly.io/docs/reference/configuration/

app = "sd-solutions-repair"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  HOSTNAME = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

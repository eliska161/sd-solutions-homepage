# fly.toml app configuration file generated for sd-solutions-repair on 2026-09-09T17:24:58Z
#
# Deploy from apps/repair. Config path: apps/repair/fly.toml
# Internal port: 3001
# See https://fly.io/docs/reference/configuration/

app = "sd-solutions-repair"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Avoid shell scripts (Windows CRLF → exit 127 "not found" on Linux).
  # NODE_PATH is set in the image for migrate-node packages.
  release_command = "node /app/scripts/fly-db-migrate.cjs"

[env]
  PORT = "3001"
  NODE_ENV = "production"
  CI = "true"
  UPLOAD_DIR = "/data/uploads"
  MAIL_FROM = "SD Solutions <kontakt@sd-solutions.org>"
  MAIL_REPLY_TO = "kontakt@sd-solutions.org"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  memory_mb = 512
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "repair_uploads"
  destination = "/data/uploads"
